<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AMC Live Apron Map</title>
<style>
/* ── Reset ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-size: 16px;
  background: linear-gradient(135deg, #3F72AF 0%, #112D4E 100%);
  display: flex; flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── Header ────────────────────────────────────────────────── */
#hdr {
  background: linear-gradient(135deg, #3F72AF, #112D4E);
  color: white;
  padding: 8px 16px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
  border-bottom: 2px solid rgba(255,255,255,0.2);
  min-height: 52px;
  flex-wrap: wrap; gap: 10px;
}
#hdr h1 { font-size: 17px; font-weight: 800; letter-spacing: 1px; white-space: nowrap; }
#hdr-left, #hdr-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.badge {
  padding: 4px 12px; border-radius: 20px;
  font-size: 13px; font-weight: 700; white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.12);
}
.badge.green  { background: rgba(22,163,74,0.35);  border-color: rgba(22,163,74,0.6); }
.badge.red    { background: rgba(220,38,38,0.35);  border-color: rgba(220,38,38,0.6); }
.badge.yellow { background: rgba(202,138,4,0.35);  border-color: rgba(202,138,4,0.6); }

#sync-wrap { font-size: 13px; color: rgba(255,255,255,0.8); white-space: nowrap; }
#sync-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: #4ade80; margin-right: 4px; vertical-align: middle;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.vbtn {
  padding: 5px 15px; font-size: 13px; font-weight: 700;
  border-radius: 6px; border: none; cursor: pointer; transition: all 0.15s;
  white-space: nowrap;
}
.vbtn.on  { background: white; color: #112D4E; }
.vbtn.off { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }
.vbtn:hover { transform: translateY(-1px); }

.zoom-bar {
  display: flex; align-items: center; gap: 4px;
  background: rgba(0,0,0,0.25); border-radius: 7px; padding: 3px 8px;
}
.zbtn {
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
  color: white; width: 28px; height: 28px; border-radius: 5px;
  cursor: pointer; font-size: 17px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.zbtn:hover { background: rgba(255,255,255,0.35); }
.zbtn.fit { width: auto; padding: 0 10px; font-size: 12px; }
#zlabel { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.9); min-width: 46px; text-align: center; }

#date-lbl { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.9); white-space: nowrap; }

#day-sel {
  padding: 5px 8px; font-size: 14px; font-weight: 700;
  border-radius: 6px; border: 1px solid rgba(255,255,255,0.35);
  background: rgba(255,255,255,0.15); color: white; cursor: pointer;
}
#day-sel option { color: #112D4E; background: white; }

/* ── Main ──────────────────────────────────────────────────── */
#main { flex: 1; position: relative; overflow: hidden; display: flex; min-height: 0; }

/* ── Apron Wrapper ─────────────────────────────────────────── */
#wrap {
  flex: 1; position: relative;
  overflow: auto;
  background:
    linear-gradient(45deg, #b8c8de 25%, #dbe7f4 25%, #dbe7f4 50%,
                    #b8c8de 50%, #b8c8de 75%, #dbe7f4 75%);
  background-size: 28px 28px;
  cursor: grab;
}
#wrap.dragging { cursor: grabbing; }
#wrap::-webkit-scrollbar { width: 8px; height: 8px; }
#wrap::-webkit-scrollbar-thumb { background: rgba(63,114,175,0.4); border-radius: 4px; }

/* ── Apron Canvas ──────────────────────────────────────────── */
#canvas {
  width: 1920px; height: 1080px;
  position: absolute; top: 0; left: 0;
  transform-origin: top left;
}

/* ── Stands ────────────────────────────────────────────────── */
.stand {
  position: absolute; z-index: 10;
  background: linear-gradient(135deg, rgba(63,114,175,0.95), rgba(17,45,78,0.95));
  border: 2.5px solid #112D4E;
  border-radius: 9px;
  padding: 11px 16px;
  font-size: 18px; font-weight: 900;
  letter-spacing: 0.4px;
  text-align: center; color: white;
  cursor: pointer; white-space: nowrap; min-width: 58px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
}
.stand:hover {
  transform: translateY(-4px) scale(1.07);
  background: linear-gradient(135deg, #DBE2EF, #3F72AF);
  border-color: #3F72AF; color: #112D4E;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3); z-index: 50;
}
.stand.sel {
  border: 3px solid #fbbf24 !important;
  box-shadow: 0 0 0 3px rgba(251,191,36,0.5), 0 4px 12px rgba(0,0,0,0.4) !important;
  z-index: 40;
}
.stand.ron {
  border: 3px solid #EAB308;
  box-shadow: 0 0 12px rgba(234,179,8,0.55), 0 4px 10px rgba(0,0,0,0.3);
}

/* ── Plane Icons ───────────────────────────────────────────── */
.icon {
  position: absolute; z-index: 20;
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; transform: translateX(-50%);
}
.icon svg { filter: drop-shadow(0 2px 5px rgba(0,0,0,0.6)); transition: transform 0.12s; }
.icon:hover svg { transform: scale(1.2); }
.icon-lbl {
  position: absolute; white-space: nowrap;
  font-size: 13px; font-weight: 800;
  color: #112D4E;
  background: rgba(255,255,255,0.97);
  border: 1.5px solid #3F72AF; border-radius: 5px;
  padding: 2px 7px; text-align: center; line-height: 1.4;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3); pointer-events: none;
}

/* ── Edit Panel ────────────────────────────────────────────── */
#panel {
  position: absolute; top: 12px; right: 12px;
  width: 330px; max-height: calc(100% - 24px);
  background: white; border-radius: 14px;
  box-shadow: 0 24px 48px rgba(0,0,0,0.4), 0 0 0 1px rgba(17,45,78,0.15);
  z-index: 200; display: none; flex-direction: column; overflow: hidden;
}
#panel.open { display: flex; }

#phdr {
  background: linear-gradient(135deg, #3F72AF, #112D4E);
  color: white; padding: 13px 16px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
#phdr h2 { font-size: 17px; font-weight: 800; }
#pclose {
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
  color: white; width: 28px; height: 28px; border-radius: 50%;
  cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s; flex-shrink: 0;
}
#pclose:hover { background: rgba(255,255,255,0.35); }

/* Departed banner */
#dep-banner {
  background: #fef3c7; border-bottom: 1px solid #f59e0b;
  padding: 7px 14px; font-size: 13px; font-weight: 700;
  color: #92400e; display: none; flex-shrink: 0;
}

#pbody {
  flex: 1; overflow-y: auto; padding: 13px 15px;
  display: flex; flex-direction: column; gap: 9px;
}
#pbody::-webkit-scrollbar { width: 5px; }
#pbody::-webkit-scrollbar-thumb { background: #DBE2EF; border-radius: 3px; }

.fg { display: flex; flex-direction: column; gap: 4px; }
.fg label {
  font-size: 11px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.7px; color: #4b5563;
}
.fg input, .fg textarea {
  width: 100%; padding: 8px 11px;
  border: 2px solid #DBE2EF; border-radius: 7px;
  font-size: 15px; font-family: inherit; color: #112D4E;
  background: #F9F7F7; outline: none;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  user-select: text;
}
.fg input:focus, .fg textarea:focus {
  border-color: #3F72AF; background: white;
  box-shadow: 0 0 0 3px rgba(63,114,175,0.2);
}
.fg textarea { resize: vertical; min-height: 46px; max-height: 80px; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.div { height: 1px; background: #DBE2EF; margin: 2px 0; }

.srow {
  display: flex; align-items: center; gap: 7px;
  font-size: 14px; font-weight: 700;
  padding: 6px 10px; border-radius: 7px;
  background: #F9F7F7; border: 1.5px solid #DBE2EF;
}
.sdot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.sdot.av { background: #16a34a; }
.sdot.oc { background: #dc2626; }
.sdot.ro { background: #EAB308; }
.sdot.pl { background: #f59e0b; }
.sdot.de { background: #9ca3af; }

#pftr {
  padding: 10px 15px; border-top: 1px solid #DBE2EF;
  background: #F9F7F7; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
#sstatus { font-size: 13px; font-weight: 700; min-height: 20px; flex: 1; }
#sstatus.saving { color: #3F72AF; }
#sstatus.saved  { color: #16a34a; }
#sstatus.error  { color: #dc2626; }
#btn-clear {
  padding: 5px 12px; font-size: 12px; font-weight: 700;
  background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5;
  border-radius: 6px; cursor: pointer; white-space: nowrap;
  transition: background 0.15s;
}
#btn-clear:hover { background: #fca5a5; }

/* ── Loading ───────────────────────────────────────────────── */
#loading {
  position: absolute; inset: 0;
  background: rgba(17,45,78,0.8);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 500; color: white; gap: 16px;
}
#loading.hidden { display: none; }
.spin {
  width: 48px; height: 48px;
  border: 5px solid rgba(255,255,255,0.3); border-top-color: white;
  border-radius: 50%; animation: sp 0.8s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }
#ltxt { font-size: 16px; font-weight: 700; }

/* ── Toast ─────────────────────────────────────────────────── */
#toasts {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  z-index: 999; display: flex; flex-direction: column; align-items: center;
  gap: 7px; pointer-events: none;
}
.toast {
  padding: 9px 20px; border-radius: 9px;
  font-size: 14px; font-weight: 700; color: white;
  box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  animation: tup 0.25s ease;
}
.toast.s { background: #16a34a; }
.toast.e { background: #dc2626; }
.toast.i { background: #3F72AF; }
.toast.w { background: #d97706; }
@keyframes tup { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

</head>
<body>

<!-- HEADER -->
<div id="hdr">
  <div id="hdr-left">
    <h1>🛫 AMC LIVE APRON MAP</h1>
    <select id="day-sel" onchange="switchDay(this.value)" title="Day of month"></select>
    <span id="date-lbl">Loading...</span>
    <span class="badge green"><span id="s-av">–</span> Free</span>
    <span class="badge red"><span id="s-oc">–</span> Occupied</span>
    <span class="badge yellow"><span id="s-rn">–</span> RON</span>
  </div>
  <div id="hdr-right">
    <span id="sync-wrap"><span id="sync-dot"></span><span id="sync-txt">Connecting...</span></span>
    <button class="vbtn on"  id="bva" onclick="switchView('a')">View A</button>
    <button class="vbtn off" id="bvb" onclick="switchView('b')">View B</button>
    <div class="zoom-bar">
      <button class="zbtn" onclick="zoomOut()" title="Zoom Out">−</button>
      <span id="zlabel">100%</span>
      <button class="zbtn" onclick="zoomIn()" title="Zoom In">+</button>
      <button class="zbtn fit" onclick="fitMap()" title="Fit to screen">↺ Fit</button>
    </div>
    <button class="zbtn" onclick="toggleFullscreen()" title="Full screen (like F11)">⛶</button>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="wrap">
    <div id="canvas"></div>

    <!-- EDIT PANEL -->
    <div id="panel">
      <div id="phdr">
        <h2 id="ptitle">Stand</h2>
        <button id="pclose" onclick="closePanel()">✕</button>
      </div>
      <div id="dep-banner">⚠ Previous Departure Data — Clear if starting fresh</div>
      <div id="pbody">

        <div class="srow">
          <div class="sdot" id="psdot"></div>
          <span id="pstext">–</span>
        </div>

        <div class="div"></div>

        <div class="fg">
          <label>Registration</label>
          <input id="f-reg" type="text" placeholder="e.g. PK-VCD" autocomplete="off" maxlength="15">
        </div>
        <div class="fg">
          <label>Type <span style="font-weight:400;font-size:10px">(auto-fills from DB)</span></label>
          <input id="f-type" type="text" placeholder="Auto-fill on registration" autocomplete="off">
        </div>

        <div class="frow">
          <div class="fg">
            <label>ON Block</label>
            <input id="f-on" type="text" placeholder="e.g. 1430" autocomplete="off">
          </div>
          <div class="fg">
            <label>OFF Block</label>
            <input id="f-off" type="text" placeholder="e.g. 1630" autocomplete="off">
          </div>
        </div>

        <div class="div"></div>

        <div class="frow">
          <div class="fg">
            <label>Arr Flight #</label>
            <input id="f-arr" type="text" placeholder="e.g. GA101" autocomplete="off">
          </div>
          <div class="fg">
            <label>Dep Flight #</label>
            <input id="f-dep" type="text" placeholder="e.g. GA102" autocomplete="off">
          </div>
        </div>

        <div class="frow">
          <div class="fg">
            <label>From <span style="font-weight:400;font-size:10px">(auto)</span></label>
            <input id="f-from" type="text" placeholder="Auto from flight#" autocomplete="off">
          </div>
          <div class="fg">
            <label>To <span style="font-weight:400;font-size:10px">(auto)</span></label>
            <input id="f-to" type="text" placeholder="Auto from flight#" autocomplete="off">
          </div>
        </div>

        <div class="div"></div>

        <div class="fg">
          <label>Operator / Airline <span style="font-weight:400;font-size:10px">(auto)</span></label>
          <input id="f-op" type="text" placeholder="Auto-fill on registration" autocomplete="off">
        </div>
        <div class="fg">
          <label>Remarks</label>
          <textarea id="f-rem" placeholder="e.g. UNSERVICEABLE, RON, etc."></textarea>
        </div>

      </div>
      <div id="pftr">
        <div id="sstatus"></div>
        <button id="btn-clear" onclick="clearStand()" title="Clear all fields for this stand">Clear Stand</button>
      </div>
    </div>

    <!-- LOADING -->
    <div id="loading">
      <div class="spin"></div>
      <div id="ltxt">Loading apron data...</div>
    </div>
  </div>
</div>

<div id="toasts"></div>

    var v = (i < 10 ? '0' : '') + i;
    var o = document.createElement('option');
    o.value = v; o.textContent = 'Day ' + v;
    sel.appendChild(o);
  }

  // Load active sheet and stand data. In the full-screen web app there
  // is no active sheet — fall back to today's day of month.
  var today = (function(){ var d = new Date().getDate(); return (d < 10 ? '0' : '') + d; })();
  google.script.run
    .withSuccessHandler(function(name) {
      var ok = /^(0[1-9]|[12][0-9]|3[01])$/.test(name);
      startDay(ok ? name : today);
    })
    .withFailureHandler(function() { startDay(today); })
    .getActiveSheetName();
});

function startDay(day) {
  sheet = day;
  document.getElementById('day-sel').value = day;
  // RON carry-over from the previous day (idempotent), then load
  google.script.run
    .withSuccessHandler(function() { loadDate(); loadStands(true); })
    .withFailureHandler(function() { loadDate(); loadStands(true); })
    .carryOverForDay(day);
}

function switchDay(day) {
  if (day === sheet) return;
  closePanel();
  startDay(day);
}

// ══════════════════════════════════════════════════════════════
//  DATA LOADING
// ══════════════════════════════════════════════════════════════
function loadDate() {
  google.script.run
    .withSuccessHandler(function(lbl) {
      document.getElementById('date-lbl').textContent = '📅 ' + lbl;
    })
    .getSheetDate(sheet);
}

function loadStands(isInit) {
  if (isInit) showLoad('Loading apron data...');
  google.script.run
    .withSuccessHandler(function(data) {
      if (data && data.error) { toast(data.error, 'e'); hideLoad(); return; }
      buildSmap(data || []);
      updateBar();
      hideLoad();
      setSyncOk(true);
      lastSync = Date.now();
      if (isInit) { buildMap(); startPoll(); }
      else         { renderAllIcons(); }
    })
    .withFailureHandler(function(err) { setSyncOk(false); hideLoad(); })
    .getAllStandData(sheet);
}

function buildSmap(arr) {
  smap = {};
  arr.forEach(function(x) { smap[x.stand] = x; });
}

// ══════════════════════════════════════════════════════════════
//  MAP BUILD
// ══════════════════════════════════════════════════════════════
function buildMap() {
  canvas.innerHTML = '';
  var coords = view === 'a' ? VA : VB;
  var allCodes = Object.keys(Object.assign({}, VA, VB));

  allCodes.forEach(function(code) {
    var el = document.createElement('div');
    el.className = 'stand';
    el.dataset.c = code;
    el.textContent = code;
    var pos = coords[code];
    if (pos) { el.style.left = pos[0]+'px'; el.style.top = pos[1]+'px'; }
    else      { el.style.display = 'none'; }
    el.addEventListener('click', function(e) { e.stopPropagation(); openPanel(code); });
    canvas.appendChild(el);
  });

  if (!window._mapWired) {
    window._mapWired = true;
    canvas.addEventListener('click', function(e) {
      if (e.target === canvas) closePanel();
    });
    setupDrag();
  }

  renderAllIcons();
  fitMap();
}

// ══════════════════════════════════════════════════════════════
//  VIEW SWITCH
// ══════════════════════════════════════════════════════════════
function switchView(v) {
  if (v === view) return;
  view = v;
  document.getElementById('bva').className = 'vbtn ' + (v==='a'?'on':'off');
  document.getElementById('bvb').className = 'vbtn ' + (v==='b'?'on':'off');
  var coords = v === 'a' ? VA : VB;
  document.querySelectorAll('.stand').forEach(function(el) {
    var pos = coords[el.dataset.c];
    if (pos) { el.style.left=pos[0]+'px'; el.style.top=pos[1]+'px'; el.style.display=''; }
    else      { el.style.display='none'; }
  });
  renderAllIcons();
}

// ══════════════════════════════════════════════════════════════
//  COLOR / STATUS
// ══════════════════════════════════════════════════════════════
function status(d) {
  // NOTE: the sheet's STATUS column (O) says "RON" for ANY row whose
  // off-block is blank — including planned and freshly-arrived aircraft —
  // so it can't distinguish states. RON (carried over from a previous
  // day) is detected from the on-block content instead: '-', 'EX RON',
  // or a '(date)' suffix, matching manual practice.
  if (!d || !d.registration || !d.registration.trim()) return 'av';
  if (d.offBlock && d.offBlock.trim()) return 'de';   // departed
  var ob = (d.onBlock || '').trim().toUpperCase();
  if (ob) {
    var carried = ob === '-' || ob.indexOf('RON') >= 0 || ob.indexOf('(') >= 0;
    return carried ? 'ro' : 'oc';                     // RON carry-over | occupied
  }
  return 'pl';                                          // planned
}

function applyColor(el, st) {
  el.classList.remove('ron', 'sel');
  el.style.background = 'linear-gradient(135deg, rgba(63,114,175,0.95), rgba(17,45,78,0.95))';
  el.style.borderColor = '#112D4E';
  el.style.color = 'white';
  if (st === 'ro') el.classList.add('ron');
}

function planeSVG(color, flip) {
  var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width','30'); svg.setAttribute('height','30');
  svg.setAttribute('viewBox','0 0 24 24');
  svg.style.transform = flip ? 'rotate(180deg)' : 'none';
  var p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('fill', color);
  p.setAttribute('d','M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z');
  svg.appendChild(p);
  return svg;
}

function renderAllIcons() {
  document.querySelectorAll('.icon').forEach(function(e){ e.remove(); });
  var coords = view === 'a' ? VA : VB;

  Object.keys(smap).forEach(function(code) {
    var d = smap[code], st = status(d);
    var el = document.querySelector('.stand[data-c="'+code+'"]');
    if (el) applyColor(el, st);

    var pos = coords[code];
    if (!pos || st === 'av' || st === 'de') return;

    var cx = pos[0] + 29;  // center of stand
    if (st === 'pl') drawIcon(code, d, cx, pos[1] - 34, '#EAB308', false);
    else             drawIcon(code, d, cx, pos[1] + 42, '#dc2626', true);
  });
}

function drawIcon(code, d, x, y, color, flip) {
  var w = document.createElement('div');
  w.className = 'icon'; w.dataset.c = code;
  w.style.left = x+'px'; w.style.top = y+'px';
  w.appendChild(planeSVG(color, flip));

  var lbl = document.createElement('div');
  lbl.className = 'icon-lbl';
  lbl.innerHTML = (d.registration||'') + (d.flightArr ? '<br>'+d.flightArr : '');
  lbl.style.position = 'absolute';
  lbl.style.left = '50%';
  lbl.style.transform = 'translateX(-50%)';
  lbl.style.top = flip ? '34px' : '-50px';
  w.appendChild(lbl);

  w.addEventListener('click', function(e){ e.stopPropagation(); openPanel(code); });
  canvas.appendChild(w);
}

function renderOneIcon(code) {
  document.querySelectorAll('.icon[data-c="'+code+'"]').forEach(function(e){ e.remove(); });
  var d = smap[code], st = status(d);
  var el = document.querySelector('.stand[data-c="'+code+'"]');
  if (el) { applyColor(el, st); if (code===selSt) el.classList.add('sel'); }

  var coords = view === 'a' ? VA : VB;
  var pos = coords[code];
  if (!pos || !d || st==='av' || st==='de') return;
  var cx = pos[0] + 29;
  if (st === 'pl') drawIcon(code, d, cx, pos[1]-34, '#EAB308', false);
  else             drawIcon(code, d, cx, pos[1]+42, '#dc2626', true);
}

// ══════════════════════════════════════════════════════════════
//  STATUS BAR
// ══════════════════════════════════════════════════════════════
function updateBar() {
  var av=0, oc=0, ro=0;
  var all = Object.keys(Object.assign({}, VA, VB));
  all.forEach(function(c) {
    var st = status(smap[c]);
    if (st==='av'||st==='de') av++;
    else if (st==='ro') ro++;
    else oc++;
  });
  document.getElementById('s-av').textContent = av;
  document.getElementById('s-oc').textContent = oc;
  document.getElementById('s-rn').textContent = ro;
}

// ══════════════════════════════════════════════════════════════
//  EDIT PANEL
// ══════════════════════════════════════════════════════════════
function openPanel(code) {
  selSt = code;
  editing = true;
  appendBusy = false;
  pendingFm  = null;

  document.querySelectorAll('.stand').forEach(function(e){ e.classList.remove('sel'); });
  var el = document.querySelector('.stand[data-c="'+code+'"]');
  if (el) el.classList.add('sel');

  var d  = smap[code] || {};
  var st = status(d);

  // Row anchor: edit the existing movement's exact row. Departed stands
  // (and stands with no record today) start a NEW movement — the first
  // save appends a fresh row to the day's log.
  selRow = (d.row && st !== 'de') ? d.row : null;

  document.getElementById('ptitle').textContent = 'Stand: ' + code;

  // If DEPARTED — show warning banner, only pre-fill registration for reference
  // Clear operational fields since this is effectively a "free" stand
  var dep = (st === 'de');
  document.getElementById('dep-banner').style.display = dep ? 'block' : 'none';

  if (dep) {
    // Show old reg as reference but clear times/flights — operator starts fresh
    document.getElementById('f-reg').value  = '';
    document.getElementById('f-type').value = '';
    document.getElementById('f-on').value   = '';
    document.getElementById('f-off').value  = '';
    document.getElementById('f-arr').value  = '';
    document.getElementById('f-dep').value  = '';
    document.getElementById('f-from').value = '';
    document.getElementById('f-to').value   = '';
    document.getElementById('f-op').value   = '';
    document.getElementById('f-rem').value  = '';
  } else {
    document.getElementById('f-reg').value  = d.registration || '';
    document.getElementById('f-type').value = d.type         || '';
    document.getElementById('f-on').value   = d.onBlock      || '';
    document.getElementById('f-off').value  = d.offBlock     || '';
    document.getElementById('f-arr').value  = d.flightArr    || '';
    document.getElementById('f-dep').value  = d.flightDep    || '';
    document.getElementById('f-from').value = d.from         || '';
    document.getElementById('f-to').value   = d.to           || '';
    document.getElementById('f-op').value   = d.operator     || '';
    document.getElementById('f-rem').value  = d.remarks      || '';
  }

  updatePanelStatus(st);
  clearSave();
  panel.classList.add('open');
  setTimeout(function(){ document.getElementById('f-reg').focus(); }, 60);
}

function closePanel() {
  panel.classList.remove('open');
  document.querySelectorAll('.stand').forEach(function(e){ e.classList.remove('sel'); });
  selSt = null;
  selRow = null;
  editing = false;
}

function clearStand() {
  // Clear all form fields
  ['f-reg','f-type','f-on','f-off','f-arr','f-dep','f-from','f-to','f-op','f-rem']
    .forEach(function(id){ document.getElementById(id).value = ''; });
  document.getElementById('dep-banner').style.display = 'none';
  document.getElementById('f-reg').focus();

  // Nothing written to the sheet yet — nothing to clear server-side
  if (!selRow) return;

  // Reset the movement row back to template state (stand code included)
  var clearedStand = selSt, clearedRow = selRow;
  setSave('saving', '💾 Clearing...');
  google.script.run
    .withSuccessHandler(function(r) {
      if (!r || !r.success) {
        var msg = r && r.error ? r.error : 'Unknown error';
        setSave('error', '⚠ ' + msg);
        toast('❌ Clear failed [' + clearedStand + '@' + sheet + ']: ' + msg, 'e');
        return;
      }
      setSave('saved', '✓ Cleared → ' + sheet);
      delete smap[clearedStand];
      if (clearedStand === selSt) { selRow = null; updatePanelStatus('av'); }
      renderOneIcon(clearedStand);
      updateBar();
    })
    .withFailureHandler(function(err) {
      var msg = err && err.message ? err.message : String(err);
      setSave('error', '⚠ ' + msg);
      toast('❌ GAS error: ' + msg, 'e');
    })
    .clearMovementRow(sheet, clearedStand, clearedRow);
}

function updatePanelStatus(st) {
  var dot  = document.getElementById('psdot');
  var text = document.getElementById('pstext');
  dot.className = 'sdot';
  var m = { av:['av','Available'], pl:['pl','Planned (no on-block yet)'],
            oc:['oc','Occupied (on block)'], ro:['ro','RON — Remain Overnight'],
            de:['de','Departed — Stand Free'] };
  var info = m[st] || ['av','–'];
  dot.classList.add(info[0]);
  text.textContent = info[1];
}

// ══════════════════════════════════════════════════════════════
//  AUTOSAVE + CLIENT-SIDE AUTOFILL
// ══════════════════════════════════════════════════════════════
function buildMap2() {
  // Only raw input columns — NEVER include type/operator/from/to here
  // to avoid overwriting VLOOKUP sheet formulas
  return {
    registration: g('f-reg').trim(),
    onBlock:      g('f-on').trim(),
    offBlock:     g('f-off').trim(),
    flightArr:    g('f-arr').trim(),
    flightDep:    g('f-dep').trim(),
    remarks:      g('f-rem').trim()
  };
}
function g(id) { return document.getElementById(id).value; }

function setupAutoSave() {

  // ── Simple fields — save on blur ──────────────────────────
  ['f-on','f-off','f-rem'].forEach(function(id) {
    document.getElementById(id).addEventListener('blur', function() {
      if (!selSt) return;
      saveToSheet(buildMap2());
    });
  });

  // ── REGISTRATION — instant autofill then save ─────────────
  // Mimics VLOOKUP(reg, DB!D:F, ...) client-side from loaded DB data
  document.getElementById('f-reg').addEventListener('blur', function() {
    if (!selSt) return;
    var reg = this.value.trim().toUpperCase();

    if (reg) {
      var hit = dbData.aircraft[reg];
      if (hit) {
        // Always overwrite autofill fields — remove guard
        if (hit.type) {
          document.getElementById('f-type').value = hit.type;
          flash('f-type');
        }
        if (hit.operator) {
          document.getElementById('f-op').value = hit.operator;
          flash('f-op');
        }
      } else {
        toast('Registration "' + reg + '" not in DB — fill manually', 'w');
      }
    }

    saveToSheet(buildMap2());
  });

  // ── ARR FLIGHT# — autofill FROM ───────────────────────────
  document.getElementById('f-arr').addEventListener('blur', function() {
    if (!selSt) return;
    var fn = this.value.trim().toUpperCase();
    if (fn && dbData.flights[fn]) {
      document.getElementById('f-from').value = dbData.flights[fn];
      flash('f-from');
    }
    saveToSheet(buildMap2());
  });

  // ── DEP FLIGHT# — autofill TO ─────────────────────────────
  document.getElementById('f-dep').addEventListener('blur', function() {
    if (!selSt) return;
    var fn = this.value.trim().toUpperCase();
    if (fn && dbData.flights[fn]) {
      document.getElementById('f-to').value = dbData.flights[fn];
      flash('f-to');
    }
    saveToSheet(buildMap2());
  });

  // ── Manual overrides (type, op, from, to) — write only if changed
  var ov = { 'f-type':'type', 'f-op':'operator', 'f-from':'from', 'f-to':'to' };
  Object.keys(ov).forEach(function(id) {
    var el = document.getElementById(id);
    var snap = '';
    el.addEventListener('focus', function(){ snap = el.value; });
    el.addEventListener('blur', function() {
      if (!selSt || el.value.trim() === snap.trim()) return;
      var fm = buildMap2();
      fm[ov[id]] = el.value.trim();
      saveToSheet(fm);
    });
  });
}

function saveToSheet(fm) {
  // Capture selection at call time — user might close panel before callback returns
  var savedStand = selSt;
  var savedRow   = selRow;

  if (savedRow === null) {
    // Nothing entered yet — don't append an empty row to the log
    var hasData = fm.registration || fm.onBlock || fm.offBlock ||
                  fm.flightArr || fm.flightDep || fm.remarks ||
                  fm.type || fm.operator || fm.from || fm.to;
    if (!hasData) return;

    // If a row-append is already in flight for this panel, queue this save —
    // firing it now would append a SECOND row. The latest snapshot wins
    // (each fm carries all raw fields).
    if (appendBusy) { pendingFm = fm; return; }
    appendBusy = true;
  }

  setSave('saving', '💾 Saving...');

  google.script.run
    .withSuccessHandler(function(r) {
      appendBusy = false;
      if (!r || !r.success) {
        var errMsg = r && r.error ? r.error : 'Unknown save error';
        setSave('error', '⚠ ' + errMsg);
        // Prominent red toast so the error is never missed
        toast('❌ Save failed [' + savedStand + '@' + sheet + ']: ' + errMsg, 'e');
        pendingFm = null;
        return;
      }
      setSave('saved', '✓ Saved → ' + sheet + ' row ' + r.row);

      // Anchor follow-up saves to the row the server resolved/appended
      if (savedStand === selSt) selRow = r.row;

      // Update local state so map icon re-renders immediately.
      // A new movement replaces the stand's previous (departed) record.
      if (!smap[savedStand] || r.appended) smap[savedStand] = { stand: savedStand, status: '' };
      var d = smap[savedStand];
      d.row = r.row;
      d.registration = fm.registration;
      d.onBlock   = fm.onBlock;
      d.offBlock  = fm.offBlock;
      d.flightArr = fm.flightArr;
      d.flightDep = fm.flightDep;
      d.remarks   = fm.remarks;
      if (fm.type)     d.type     = fm.type;
      if (fm.operator) d.operator = fm.operator;
      if (fm.from)     d.from     = fm.from;
      if (fm.to)       d.to       = fm.to;
      // Also capture whatever is currently showing in autofill fields
      if (savedStand === selSt) {
        var tv = g('f-type'), ov2 = g('f-op'), fv = g('f-from'), tov = g('f-to');
        if (tv)  d.type     = tv;
        if (ov2) d.operator = ov2;
        if (fv)  d.from     = fv;
        if (tov) d.to       = tov;
      }

      renderOneIcon(savedStand);
      updateBar();
      if (savedStand === selSt) updatePanelStatus(status(smap[savedStand]));

      // Flush any save queued while the append was in flight
      if (pendingFm) {
        var queued = pendingFm; pendingFm = null;
        if (savedStand === selSt) saveToSheet(queued);
      }
    })
    .withFailureHandler(function(err) {
      appendBusy = false;
      pendingFm  = null;
      var errMsg = err && err.message ? err.message : String(err);
      setSave('error', '⚠ ' + errMsg);
      toast('❌ GAS error [' + savedStand + '@' + sheet + ']: ' + errMsg, 'e');
    })
    .updateStandField(sheet, savedStand, savedRow, fm);
}

// ══════════════════════════════════════════════════════════════
//  SAVE STATUS
// ══════════════════════════════════════════════════════════════
var saveTimer = null;
function setSave(type, msg) {
  var el = document.getElementById('sstatus');
  el.textContent = msg; el.className = type;
  clearTimeout(saveTimer);
  if (type === 'saved') saveTimer = setTimeout(function(){ el.textContent=''; el.className=''; }, 3000);
}
function clearSave() { var el=document.getElementById('sstatus'); el.textContent=''; el.className=''; }

// Flash autofilled field blue briefly
function flash(id) {
  var el = document.getElementById(id);
  el.style.background = '#dbeafe';
  el.style.transition = 'background 0.15s';
  setTimeout(function(){
    el.style.background = 'white';
    setTimeout(function(){ el.style.background=''; el.style.transition=''; }, 400);
  }, 600);
}

// ══════════════════════════════════════════════════════════════
//  POLLING
// ══════════════════════════════════════════════════════════════
function startPoll() {
  // Idempotent — day switches re-init the map
  if (pollId)     clearInterval(pollId);
  if (syncDispId) clearInterval(syncDispId);
  pollId = setInterval(function() {
    if (editing) return;
    google.script.run
      .withSuccessHandler(function(data) {
        if (!data || data.error) return;
        buildSmap(data);
        renderAllIcons();
        updateBar();
        setSyncOk(true);
        lastSync = Date.now();
      })
      .withFailureHandler(function(){ setSyncOk(false); })
      .getAllStandData(sheet);
  }, 15000);

  syncDispId = setInterval(function() {
    if (!lastSync) return;
    var s = Math.round((Date.now()-lastSync)/1000);
    document.getElementById('sync-txt').textContent = s < 5 ? 'Live' : 'Synced '+s+'s ago';
  }, 1000);
}

function setSyncOk(ok) {
  document.getElementById('sync-dot').style.background = ok ? '#4ade80' : '#f87171';
}

// ══════════════════════════════════════════════════════════════
//  ZOOM — fit to WIDTH (allow vertical scroll)
// ══════════════════════════════════════════════════════════════
function fitMap() {
  // Scale so the map fills the wrapper width; user scrolls vertically
  var ww = wrap.clientWidth || window.innerWidth;
  zoom = Math.max(0.1, (ww / 1920) * 0.99);
  applyZoom();
}

function applyZoom() {
  canvas.style.transform = 'scale(' + zoom + ')';
  canvas.style.transformOrigin = 'top left';
  // Expand scroll area to match scaled canvas
  canvas.style.marginRight  = Math.round(1920 * zoom) + 'px';
  canvas.style.marginBottom = Math.round(1080 * zoom) + 'px';
  document.getElementById('zlabel').textContent = Math.round(zoom*100) + '%';
}

function zoomIn()  { zoom = Math.min(MAX_Z, +(zoom+STEP_Z).toFixed(2)); applyZoom(); }
function zoomOut() { zoom = Math.max(MIN_Z, +(zoom-STEP_Z).toFixed(2)); applyZoom(); }

// True browser fullscreen (works in the web-app tab; the in-sheet dialog
// iframe blocks it — in that case point the user to the full-screen mode)
function toggleFullscreen() {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  var p = document.documentElement.requestFullscreen &&
          document.documentElement.requestFullscreen();
  if (p && p.catch) p.catch(function() {
    toast('Full screen is blocked inside the sheet dialog — use AMC Tools → Open Apron Map after deploying the web app (opens in its own tab)', 'w');
  });
  setTimeout(fitMap, 350);
}

window.addEventListener('resize', fitMap);

// Ctrl+Scroll zoom
document.addEventListener('wheel', function(e) {
  if (!e.ctrlKey) return;
  e.preventDefault();
  if (e.deltaY < 0) zoomIn(); else zoomOut();
}, { passive: false });

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closePanel();
  if (e.ctrlKey && e.key === '0') { e.preventDefault(); fitMap(); }
  if (e.ctrlKey && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomIn(); }
  if (e.ctrlKey && e.key === '-') { e.preventDefault(); zoomOut(); }
});

// ══════════════════════════════════════════════════════════════
//  DRAG-TO-PAN
// ══════════════════════════════════════════════════════════════
function setupDrag() {
  var down = false, sx, sy, slx, sly;

  wrap.addEventListener('mousedown', function(e) {
    // Only start drag on the background, not on stands or the edit panel
    if (e.target.closest('.stand') || e.target.closest('#panel') || e.target.closest('.icon')) return;
    down = true;
    sx  = e.clientX; sy  = e.clientY;
    slx = wrap.scrollLeft; sly = wrap.scrollTop;
    wrap.classList.add('dragging');
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!down) return;
    wrap.scrollLeft = slx - (e.clientX - sx);
    wrap.scrollTop  = sly - (e.clientY - sy);
  });

  document.addEventListener('mouseup', function() {
    down = false;
    wrap.classList.remove('dragging');
  });
}

// ══════════════════════════════════════════════════════════════
//  LOADING & TOAST
// ══════════════════════════════════════════════════════════════
function showLoad(msg) { document.getElementById('ltxt').textContent = msg||'Loading...'; loading.classList.remove('hidden'); }
function hideLoad() { loading.classList.add('hidden'); }

function toast(msg, type) {
  var host = document.getElementById('toasts');
  var t = document.createElement('div');
  t.className = 'toast ' + (type||'i');
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 4000);
}

// ══════════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════════
setupAutoSave();
</script>
