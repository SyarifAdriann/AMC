ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Allow .htaccess overrides (required for mod_rewrite routing)
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Deny access to sensitive file types (belt-and-suspenders alongside .htaccess)
    <FilesMatch "\.(sql|log|ini|md|markdown|csv|xlsx|xls|docx|doc|txt|pkl|joblib|py|pyc|ipynb|gsheet|json|lock|ya?ml|sh|bak|env|conf)$">
        Require all denied
    </FilesMatch>

    # Deny access to hidden files and directories (.git, .env, ...)
    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Application internals must never be served directly
    <DirectoryMatch "^/var/www/html/(app|bootstrap|config|database|routes|storage|resources|tests|ml|data|docs|gas|sheets|reports|CLI|logs)(/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
