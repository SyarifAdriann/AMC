; =============================================================================
; AMC Custom PHP Configuration
; Matches settings documented in docs/DEPENDENCIES.md
; =============================================================================

; Memory & Execution
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Upload limits
upload_max_filesize = 10M
post_max_size = 10M

; Error reporting (visible in container logs)
display_errors = Off
log_errors = On
error_reporting = E_ALL

; Session settings — 30 days, matching config/session.php (no ops timeout)
session.gc_maxlifetime = 2592000
session.cookie_httponly = 1
session.use_strict_mode = 1

; Store sessions inside the app_storage volume rather than the container's own
; filesystem. Without this every "docker compose up --build" wipes every
; session, so anyone with a page open is silently logged out and their next
; save fails. storage/ is blocked from the web by both .htaccess and the vhost.
; The entrypoint creates and chowns this directory before Apache starts.
session.save_path = "/var/www/html/storage/sessions"

; Timezone (adjust if needed)
date.timezone = Asia/Jakarta
