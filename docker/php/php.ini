; =============================================================================
; AMC Custom PHP Configuration
; Matches settings documented in docs/DEPENDENCIES.md
; =============================================================================

; Memory & Execution
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Upload limits
upload_max_filesize = 10M
post_max_size = 10M

; Error reporting (visible in container logs)
display_errors = Off
log_errors = On
error_reporting = E_ALL

; Session settings
session.gc_maxlifetime = 1800
session.cookie_httponly = 1
session.use_strict_mode = 1

; Timezone (adjust if needed)
date.timezone = Asia/Jakarta
